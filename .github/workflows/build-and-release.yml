name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Tooling Diagnostics
        run: |
          flutter --version
          java -version

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "API_BASE_URL=http://10.0.2.2:8000" > .env
            fi
          fi
          flutter pub get

      - name: Run Quality Gate (Analyze & Test)
        run: |
          cd mobile
          flutter analyze
          flutter test

      - name: Extract Version & Build Metadata
        id: meta
        run: |
          VERSION=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          BUILD_NUM=${{ github.run_number }}
          TAG_NAME="v${VERSION}-b${BUILD_NUM}"
          RELEASE_TITLE="ReceiptLedger v${VERSION} (Build ${BUILD_NUM})"
          DATE_STR=$(date -u +"%Y-%m-%d %H:%M UTC")
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT
          echo "date=${DATE_STR}" >> $GITHUB_OUTPUT

      - name: Build Android Release APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Prepare Release Artifacts & Checksums
        id: artifacts
        run: |
          SRC_APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          DEST_APK="ReceiptLedger-v${{ steps.meta.outputs.version }}-release.apk"
          cp "$SRC_APK" "$DEST_APK"
          
          FILE_SIZE=$(du -h "$DEST_APK" | cut -f1)
          SHA256_HASH=$(sha256sum "$DEST_APK" | cut -d' ' -f1)
          
          echo "apk_path=${DEST_APK}" >> $GITHUB_OUTPUT
          echo "file_size=${FILE_SIZE}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA256_HASH}" >> $GITHUB_OUTPUT

      - name: Generate Release Notes & Specifications
        run: |
          cat << 'EOF' > release_notes.md
          ## 🧾 ReceiptLedger Android Release
          
          **Turning physical receipt photos into structured spending intelligence.**
          
          ---
          
          ### 📱 Build Information & Technical Specifications
          
          | Specification | Value |
          | :--- | :--- |
          | **Application Name** | **ReceiptLedger Mobile** |
          | **Version** | `v${{ steps.meta.outputs.version }}` |
          | **Build Run** | `#${{ github.run_number }}` |
          | **Build Date** | `${{ steps.meta.outputs.date }}` |
          | **Commit SHA** | `${{ github.sha }}` |
          | **Package ID** | `com.receiptledger.receipt_ledger_mobile` |
          | **Target Architectures** | Universal (`arm64-v8a`, `armeabi-v7a`, `x86_64`) |
          | **Minimum Android OS** | Android 6.0 Marshmallow (API Level 23) |
          | **Target Android OS** | Android 14 Upside Down Cake (API Level 34) |
          | **Package Size** | `${{ steps.artifacts.outputs.file_size }}` |
          | **SHA-256 Checksum** | `${{ steps.artifacts.outputs.sha256 }}` |
          
          ---
          
          ### ✨ Key Features in this Build
          
          - **Cohesive Animated Splash Screen**:
            - Concentric ambient pulse rings matching the organic financial ledger theme (`#1E3A2B` forest pine and linen canvas).
            - Real-time backend telemetry ticker and animated linear progress bar.
            - Intelligent auto-handoff into authentication or main dashboard, with manual skip button.
          - **Complete Authentication & Session Management**:
            - Sliding pill tab switcher between **Sign In** and **Create Account**.
            - **1-Click Instant Demo Credentials** (`user@receiptledger.com` / `demo1234`) for instant exploration.
            - Robust client-side validation, currency selection, and biometric quick-login toggle.
            - Full keyboard overflow protection with adaptive scrolling.
          - **Organic Financial Ledger UI & Layout Refinements**:
            - Floating pill navigation with desktop & web hover scaling.
            - Interactive spend aggregation with dynamic sparkline charts and daily transaction drill-down.
            - Optimized 110px bottom clearance preventing any floating navbar occlusion.
          - **Receipt OCR & Verification Review Queue**:
            - Dual OCR processing path (Gemini 3.5 Flash Lite + Local Tesseract/EasyOCR fallback).
            - Human-in-the-loop review queue with split cropped slip snippets and multi-category reclassification.
          - **Zero-Cost Tunneling Architecture**:
            - Seamless connectivity with local, Cloudflare, or Pinggy tunneled backends without requiring cloud billing.
          
          ---
          
          ### 📥 Installation Instructions
          
          1. Download the attached APK: **[`${{ steps.artifacts.outputs.apk_path }}`](https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/${{ steps.artifacts.outputs.apk_path }})**.
          2. Transfer or open the file on your Android device.
          3. When prompted, permit your browser or file manager to *"Install unknown apps"*.
          4. Complete installation and launch **ReceiptLedger**.
          5. Tap **1-Click Demo Credentials** on the login screen to start exploring immediately!
          EOF

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: release_notes.md
          files: ${{ steps.artifacts.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
