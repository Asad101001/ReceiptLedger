    function App() {
      const [overview, setOverview] = useState(INITIAL_OVERVIEW);
      const [queue, setQueue] = useState(INITIAL_QUEUE);
      const [activeIndex, setActiveIndex] = useState(0);
      const [ledger, setLedger] = useState(SAMPLE_LEDGER_RECEIPTS);
      const [searchQuery, setSearchQuery] = useState('');
      const [typeFilter, setTypeFilter] = useState('ALL');
      const [selectedRowIndex, setSelectedRowIndex] = useState(0);
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [inspectedReceipt, setInspectedReceipt] = useState(null);
      const [uploadModalOpen, setUploadModalOpen] = useState(false);
      const [shortcutsModalOpen, setShortcutsModalOpen] = useState(false);
      const [toast, setToast] = useState(null);
      
      // Zoom & Pan for Left Canvas
      const [zoom, setZoom] = useState(1.5);
      const [pan, setPan] = useState({ x: 0, y: -20 });
      const [isDragging, setIsDragging] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

      // Form State for Workspace A
      const currentItem = queue[activeIndex] || null;
      const [candidateName, setCandidateName] = useState('');
      const [quantity, setQuantity] = useState(1);
      const [unit, setUnit] = useState('pcs');
      const [unitPrice, setUnitPrice] = useState(0);
      const [totalPrice, setTotalPrice] = useState(0);
      const searchInputRef = useRef(null);
      const nameInputRef = useRef(null);

      useEffect(() => {
        if (currentItem) {
          setCandidateName(currentItem.candidate_name);
          setQuantity(currentItem.quantity);
          setUnit(currentItem.unit);
          setUnitPrice(currentItem.unit_price);
          setTotalPrice(currentItem.total_price);
          setZoom(1.5);
          setPan({ x: 0, y: -20 });
          setTimeout(() => {
            if (nameInputRef.current) {
              nameInputRef.current.focus();
              nameInputRef.current.select();
            }
          }, 50);
        }
      }, [currentItem, activeIndex]);

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      // 1-Click Accept (Enter)
      const handleAccept = () => {
        if (!currentItem) return;
        showToast(`Accepted: "${candidateName}" (Action: ACCEPTED)`);
        advanceQueue();
      };

      // Save Edits (Ctrl+S)
      const handleSaveEdits = () => {
        if (!currentItem) return;
        showToast(`Saved Edits: "${candidateName}" Qty: ${quantity} Price: ${unitPrice} (Action: EDITED)`);
        advanceQueue();
      };

      const advanceQueue = () => {
        const nextQueue = queue.filter((_, idx) => idx !== activeIndex);
        setQueue(nextQueue);
        if (activeIndex >= nextQueue.length) {
          setActiveIndex(Math.max(0, nextQueue.length - 1));
        }
        setOverview(prev => ({
          ...prev,
          pending_review_count: Math.max(0, prev.pending_review_count - 1),
          verified_items_count: prev.verified_items_count + 1
        }));
      };

      // Seed Demo Data
      const handleSeedDemo = () => {
        setOverview(INITIAL_OVERVIEW);
        setQueue(INITIAL_QUEUE);
        setLedger(SAMPLE_LEDGER_RECEIPTS);
        setActiveIndex(0);
        showToast("Seeded 148 realistic receipts & 7 review items.");
      };

      // Reset Ledger
      const handleResetLedger = () => {
        if (!window.confirm("Reset ledger to zero-data state?")) return;
        setOverview({
          period: "2026-10",
          total_spend: 0,
          delta_percentage: 0,
          receipt_count: 0,
          pending_review_count: 0,
          verified_items_count: 0,
          category_breakdown: []
        });
        setQueue([]);
        setLedger([]);
        showToast("Ledger reset to zero-data state.");
      };

      // Keyboard ergonomics
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
            if (e.key === 'Enter') {
              e.preventDefault();
              handleAccept();
            } else if ((e.ctrlKey || e.metaKey) && e.key === 's') {
              e.preventDefault();
              handleSaveEdits();
            } else if (e.key === 'Escape') {
              e.target.blur();
            }
            return;
          }

          if (e.key === '/') {
            e.preventDefault();
            if (searchInputRef.current) {
              searchInputRef.current.focus();
              searchInputRef.current.select();
            }
          } else if (e.key === '?') {
            e.preventDefault();
            setShortcutsModalOpen(prev => !prev);
          } else if (e.key === 'ArrowDown' || e.key === 'j' || e.key === 'J') {
            e.preventDefault();
            setSelectedRowIndex(prev => Math.min(filteredLedger.length - 1, prev + 1));
          } else if (e.key === 'ArrowUp' || e.key === 'k' || e.key === 'K') {
            e.preventDefault();
            setSelectedRowIndex(prev => Math.max(0, prev - 1));
          } else if (e.key === ' ' || e.code === 'Space') {
            e.preventDefault();
            if (filteredLedger[selectedRowIndex]) {
              setInspectedReceipt(filteredLedger[selectedRowIndex]);
              setDrawerOpen(true);
            }
          } else if (e.key === 'Escape') {
            setDrawerOpen(false);
            setUploadModalOpen(false);
            setShortcutsModalOpen(false);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [queue, activeIndex, candidateName, quantity, unitPrice, selectedRowIndex]);

      const filteredLedger = ledger.filter(r => {
        if (typeFilter !== 'ALL' && r.receipt_type !== typeFilter) return false;
        if (searchQuery && !r.merchant_name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
        return true;
      });

              </div>

                <span className="flex items-center gap-1.5 text-emerald-400 font-semibold">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
                  ALL ENGINES OPERATIONAL
                </span>
                <span className="text-slate-600">|</span>
                <span className="text-slate-300 bg-slate-800 px-1.5 py-0.5 rounded text-[11px]">GEMINI AI</span>
                <span className="text-slate-300 bg-slate-800 px-1.5 py-0.5 rounded text-[11px]">CLOUD VISION</span>
                <span className="text-slate-300 bg-slate-800 px-1.5 py-0.5 rounded text-[11px]">SUPABASE</span>
              </div>

              {/* Action Controls */}
              <div className="flex items-center gap-2">
                <button
                  onClick={handleSeedDemo}
                  className="bg-emerald-700 hover:bg-emerald-600 text-white font-mono text-xs font-semibold px-3 py-1.5 rounded border border-emerald-500 transition-colors"
                >
                  Seed Demo Data (148)
                </button>
                <button
                  onClick={handleResetLedger}
                  className="bg-slate-800 hover:bg-red-950 text-slate-300 font-mono text-xs px-2.5 py-1.5 rounded border border-slate-700 transition-colors"
                >
                  Reset Ledger
                </button>
                <button
                  onClick={() => setUploadModalOpen(true)}
                  className="bg-blue-600 hover:bg-blue-500 text-white font-mono text-xs font-semibold px-3 py-1.5 rounded border border-blue-500 transition-colors"
                >
                  Upload Receipt
                </button>
                <button
                  onClick={() => setShortcutsModalOpen(true)}
                  title="Shortcuts (?)"
                  className="w-7 h-7 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700 flex items-center justify-center font-mono text-xs"
                >
                  ?
                </button>
              </div>
            </div>
          </header>

          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-14 right-5 z-50">
              <div className="bg-slate-900 text-white border border-slate-700 px-4 py-2.5 rounded font-mono text-xs shadow-xl">
                {toast.msg}
              </div>
            </div>
          )}

          {/* Main Container */}
          <main className="flex-1 max-w-[1920px] w-full mx-auto flex flex-col p-5 space-y-4">
            {/* KPI Cards Row (Section 2) */}
            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
              <div className="bg-white border border-[#CBD5E1] rounded p-4">
                <div className="flex justify-between items-center text-[11px] font-mono font-bold text-slate-500 uppercase">
                  <span>TOTAL INGESTED</span>
                  <span className="text-emerald-700 bg-emerald-100 border border-emerald-300 px-1.5 py-0.5 rounded font-semibold">
                    +{overview.delta_percentage}%
                  </span>
                </div>
                <div className="font-mono font-bold text-2xl text-slate-900 mt-2">
                  {overview.receipt_count} Receipts
                </div>
                <div className="text-xs text-slate-500 font-sans mt-1">130 in prior month</div>
              </div>

              <div className="bg-white border border-[#CBD5E1] rounded p-4">
                <div className="flex justify-between items-center text-[11px] font-mono font-bold text-slate-500 uppercase">
                  <span>TOTAL RECONCILED SPEND</span>
                  <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                </div>
                <div className="font-mono font-bold text-2xl text-slate-900 mt-2">
                  PKR {overview.total_spend.toLocaleString('en-US', { minimumFractionDigits: 2 })}
                </div>
                <div className="text-xs text-slate-500 font-sans mt-1">October 2026 Fiscal Ledger</div>

                </div>
                <div className="text-right">
                  <button onClick={() => { setUploadModalOpen(false); showToast("Demo receipt ingested."); }} className="bg-blue-600 text-white px-4 py-1.5 rounded text-xs font-bold">
                    Ingest Sample
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Section 5 Keyboard Shortcuts Modal */}
          {shortcutsModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div onClick={() => setShortcutsModalOpen(false)} className="fixed inset-0 bg-slate-950/70" />
              <div className="relative w-full max-w-lg bg-white border border-[#CBD5E1] rounded shadow-2xl p-5 z-10 space-y-4 font-mono text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-sm uppercase">Section 5 Shortcuts Cheat Sheet</h3>
                  <button onClick={() => setShortcutsModalOpen(false)}>✕</button>
                </div>
                <div className="space-y-2">
                  <div className="flex justify-between"><span><kbd>Enter</kbd></span><span>1-Click Approve item ("ACCEPTED")</span></div>
                  <div className="flex justify-between"><span><kbd>Ctrl+S</kbd></span><span>Save inline edits ("EDITED")</span></div>
                  <div className="flex justify-between"><span><kbd>Tab</kbd> / <kbd>Shift+Tab</kbd></span><span>Advance between input fields</span></div>
                  <div className="flex justify-between"><span><kbd>↑</kbd> <kbd>↓</kbd> or <kbd>J</kbd> <kbd>K</kbd></span><span>Select previous / next ledger row</span></div>
                  <div className="flex justify-between"><span><kbd>Space</kbd></span><span>Open Slide-Out Inspector Drawer</span></div>
                  <div className="flex justify-between"><span><kbd>Esc</kbd></span><span>Dismiss Drawer or Modals</span></div>
                  <div className="flex justify-between"><span><kbd>/</kbd></span><span>Jump to search input</span></div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
