name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Tooling Diagnostics
        run: |
          flutter --version
          java -version

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "API_BASE_URL=http://10.0.2.2:8000" > .env
            fi
          fi
          flutter pub get

      - name: Run Quality Gate (Analyze & Test)
        run: |
          cd mobile
          flutter analyze
          flutter test

      - name: Extract Version & Build Metadata
        id: meta
        run: |
          VERSION=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          BUILD_NUM=${{ github.run_number }}
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE_CODE=$(date -u +"%Y%m%d")
          DATE_STR=$(date -u +"%Y-%m-%d %H:%M UTC")
          TAG_NAME="v${VERSION}-preview.${BUILD_NUM}.${SHORT_SHA}"
          RELEASE_TITLE="ReceiptLedger v${VERSION} • Preview Build #${BUILD_NUM} (${SHORT_SHA})"
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_num=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT
          echo "date=${DATE_STR}" >> $GITHUB_OUTPUT

      - name: Build Android Release APK
        run: |
          cd mobile
          flutter build apk --release --build-name="${{ steps.meta.outputs.version }}" --build-number="${{ steps.meta.outputs.build_num }}"

      - name: Prepare Release Artifacts & Checksums
        id: artifacts
        run: |
          SRC_APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          BUILD_APK="ReceiptLedger-v${{ steps.meta.outputs.version }}-b${{ steps.meta.outputs.build_num }}-${{ steps.meta.outputs.short_sha }}.apk"
          RELEASE_APK="ReceiptLedger-v${{ steps.meta.outputs.version }}-release.apk"
          
          cp "$SRC_APK" "$BUILD_APK"
          cp "$SRC_APK" "$RELEASE_APK"
          
          FILE_SIZE=$(du -h "$BUILD_APK" | cut -f1)
          SHA256_HASH=$(sha256sum "$BUILD_APK" | cut -d' ' -f1)
          
          echo "apk_path=${BUILD_APK}" >> $GITHUB_OUTPUT
          echo "release_apk_path=${RELEASE_APK}" >> $GITHUB_OUTPUT
          echo "file_size=${FILE_SIZE}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA256_HASH}" >> $GITHUB_OUTPUT

      - name: Generate Release Notes & Specifications
        run: |
          cat << 'EOF' > release_notes.md
          ## 🧾 ReceiptLedger Android Release
          
          **Turning physical receipt photos into structured spending intelligence.**
          
          ---
          
          ### 📱 Build Information & Technical Specifications
          
          | Specification | Value |
          | :--- | :--- |
          | **Application Name** | **ReceiptLedger Mobile** |
          | **Semantic Version** | `v${{ steps.meta.outputs.version }}` |
          | **Build Run** | `#${{ steps.meta.outputs.build_num }}` |
          | **Commit Reference** | `${{ steps.meta.outputs.short_sha }}` (`${{ github.sha }}`) |
          | **Build Date** | `${{ steps.meta.outputs.date }}` |
          | **Package ID** | `com.receiptledger.receipt_ledger_mobile` |
          | **Primary Artifact** | `${{ steps.artifacts.outputs.apk_path }}` |
          | **Target Architectures** | Universal (`arm64-v8a`, `armeabi-v7a`, `x86_64`) |
          | **Minimum Android OS** | Android 6.0 Marshmallow (API Level 23) |
          | **Target Android OS** | Android 14 Upside Down Cake (API Level 34) |
          | **Package Size** | `${{ steps.artifacts.outputs.file_size }}` |
          | **SHA-256 Checksum** | `${{ steps.artifacts.outputs.sha256 }}` |
          
          ---
          
          ### ✨ Key Features in this Build
          
          - **Cohesive Categorization Palette & Visual Flavor**:
            - Distinctive, executive color-coded labels across all transaction streams (Groceries, Fuel, Bakeries, Utilities, Healthcare, Household).
            - Custom category badges and avatars with tasteful pastel tints, matching borders, and icons.
          - **Spending Velocity Distribution Metric Bar**:
            - Multi-segment interactive category velocity breakdown chart on the Ledger dashboard.
            - Interactive filter tabs linking category distributions directly to transaction history.
          - **60 FPS / High-Refresh-Rate Fluidity**:
            - Bouncing scroll physics enabled across all mobile screens for buttery inertia flinging.
            - Isolated RepaintBoundary sparkline rendering with anti-aliased Bézier curves and subtle linear gradient fills.
          - **Persistent & Dismissible App Toasts**:
            - Extended 5-second persistent duration with interactive close button and animated countdown progress bar.
          - **High-Fidelity Seed Demo Data**:
            - 10 realistic Pakistani retail receipts covering Imtiaz, Shell, Rahat, Servaid, K-Electric, Metro, Espresso, Total Parco, and D.Watson.
            - 7 diverse OCR verification review queue items with multi-category reclassification.
          - **Production-Grade Version Numbering**:
            - Git commit-tagged semantic versioning with embedded Android build names and numbers.
          
          ---
          
          ### 📥 Installation Instructions
          
          1. Download the attached APK: **[`${{ steps.artifacts.outputs.apk_path }}`](https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/${{ steps.artifacts.outputs.apk_path }})** (or the release mirror: **[`${{ steps.artifacts.outputs.release_apk_path }}`](https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/${{ steps.artifacts.outputs.release_apk_path }})**).
          2. Transfer or open the file on your Android device.
          3. When prompted, permit your browser or file manager to *"Install unknown apps"*.
          4. Complete installation and launch **ReceiptLedger**.
          5. Tap **1-Click Demo Credentials** on the login screen to start exploring immediately!
          EOF

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: release_notes.md
          files: |
            ${{ steps.artifacts.outputs.apk_path }}
            ${{ steps.artifacts.outputs.release_apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
